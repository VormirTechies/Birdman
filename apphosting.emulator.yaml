env:
  # The Admin SDK reads this variable automatically. Keep the value without
  # an http:// prefix, as required by the Firestore emulator.
  - variable: FIRESTORE_EMULATOR_HOST
    value: 127.0.0.1:7003
    availability:
      - RUNTIME
  - variable: FIRESTORE_DATABASE_ID
    value: (default)
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL
    value: http://127.0.0.1:7002
    availability:
      - BUILD
      - RUNTIME
